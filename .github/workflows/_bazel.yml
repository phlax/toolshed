name: _bazel

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      action:
        description: Bazel action (build or test)
        required: true
        type: string
      name:
        description: >-
          Unique name for this matrix leg. Used (with `action`) to scope the
          concurrency group so that legs cancel their own previous runs
          without cancelling each other.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label
        type: string
        default: ubuntu-24.04
      artifact-name:
        type: string
        default: bazel-artifacts
      artifacts:
        description: Artifacts to upload
        required: false
        type: string
      bazel-args:
        description: Bazel args
        default:
        type: string
      create-source:
        type: boolean
        default: false
      rbe:
        description: Enable EngFlow RBE (appends the selected RBE config when auth passes)
        type: boolean
        default: false
      rbe-config:
        description: Bazel RBE config to append when RBE is enabled and authorized
        type: string
        default: rbe
      rbe-bes:
        description: Append --config=bes with the selected RBE config
        type: boolean
        default: true
      bazel-mode:
        description: Bazel mode (workspace or bzlmod)
        required: true
        type: string
      bazel-path:
        description: Path to bazel workspace
        default: .
        type: string
      targets:
        description: Bazel targets
        required: true
        type: string
      privileged:
        description: >-
          Run in the privileged container variant (required for cross-compile
          jobs that need debootstrap / qemu-user-static / binfmt-support).
        required: false
        type: boolean
        default: false
      upload:
        description: Upload CI artifacts
        type: boolean
        default: false

# Reusable workflows do not inherit the calling workflow's concurrency group,
# so a cancelled parent can leave these jobs running (showing "waiting for
# another run"). Adding an explicit group here ensures cancellation propagates.
#
# `github.workflow` resolves to the *calling* workflow's name inside a reusable
# workflow, so the group stays caller-scoped.
#
# The `action`+`name` suffix keeps matrix legs in separate groups — without it
# all legs share one group and serialise, each cancelling the last. `action` is
# required because the `build` and `test` matrices both contain legs named
# `workspace` and `bzlmod`, which would otherwise collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ inputs.action }}-${{ inputs.name }}
  cancel-in-progress: true


jobs:
  bazel:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    name: Bazel (${{ inputs.action }})
    permissions:
      contents: read
      packages: read
    steps:
    - uses: envoyproxy/toolshed/actions/bind-mounts@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      if: runner.os == 'Linux'
      with:
        mounts: |
          - src: /mnt/workspace
            target: ${{ github.workspace }}
            chown: "runner:runner"
          - src: /mnt/cache
            target: /home/runner/.cache
            chown: "runner:runner"
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup Bazel
      if: runner.os != 'Linux'
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2  # v3
    - name: Get runner UID/GID
      if: runner.os == 'Linux'
      id: runner-ids
      run: |
        echo "uid=$(id -u)" >> "${GITHUB_OUTPUT}"
        echo "gid=$(id -g)" >> "${GITHUB_OUTPUT}"
    - name: Set up Docker Buildx
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0
    - name: Build Bazel container image
      # Note: `docker buildx bake` resolves the compose file's `context: .`
      # relative to the *invocation* directory, not the compose file (this
      # differs from `docker compose`, which resolves relative to --file).
      # Run from `docker/` so the context is `docker/` and the dockerfile
      # resolves to `docker/bazel/Dockerfile`.
      if: runner.os == 'Linux'
      shell: bash
      working-directory: docker
      run: |
        docker buildx bake \
          --file docker-compose.yml \
          --set "*.cache-from=type=gha,scope=bazel-container" \
          --set "*.cache-to=type=gha,scope=bazel-container,mode=max" \
          --load \
          ${{ inputs.privileged && 'bazel-privileged' || 'bazel' }}
      env:
        UID: ${{ steps.runner-ids.outputs.uid }}
        GID: ${{ steps.runner-ids.outputs.gid }}
        USER_NAME: runner
        SOURCE_DIR: ${{ github.workspace }}
    - name: Register binfmt handlers (host-level, cross-compile only)
      if: runner.os == 'Linux' && inputs.privileged
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y --no-install-recommends \
            qemu-user-static binfmt-support
    - name: Configure repo Bazel settings
      if: vars.TOOLSHED_CI_BAZELRC
      shell: bash
      run: |
        echo "${BAZELRC_CONTENT}" > repo.bazelrc
      working-directory: ${{ inputs.bazel-path }}
      env:
        BAZELRC_CONTENT: ${{ vars.TOOLSHED_CI_BAZELRC }}
    - name: RBE auth check
      id: rbe
      if: inputs.rbe && github.event_name == 'pull_request'
      uses: envoyproxy/toolshed/actions/github/container/auth@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        container: hello-world
    - name: Bazel targets (${{ inputs.action }}/${{ inputs.bazel-mode }}) [container]
      if: runner.os == 'Linux'
      shell: bash
      run: |
        BAZEL_CMD="bazel ${{ inputs.action }} \
          ${{ inputs.bazel-args }} \
          ${{ (steps.rbe.outputs.authorized == 'true'
               || github.event_name != 'pull_request')
              && format('--config={0}{1}',
                  inputs.rbe-config || 'rbe',
                  inputs.rbe-bes && ' --config=bes' || '') || '' }} \
            ${{ inputs.upload && inputs.artifacts && '--remote_download_toplevel' || '' }} ${{ inputs.targets }}"
        cat > "${GITHUB_WORKSPACE}/_bazel_run.sh" << 'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        eval "${BAZEL_CMD}"
        # Artifact patterns are embedded at workflow-template time.
        # When inputs.artifacts is empty the variable is an empty string
        # and the copy block is skipped.
        PATTERNS="${ARTIFACT_PATTERNS}"
        if [[ -n "${PATTERNS}" ]]; then
          BAZEL_BIN="$(bazel info bazel-bin)"
          DIST_DIR=/source/dist
          while IFS= read -r pattern; do
            [[ -z "${pattern}" ]] && continue
            dir="$(dirname "${pattern}")"
            mkdir -p "${DIST_DIR}/${dir}"
            # Expand the glob inside the container (where bazel-bin exists)
            # and dereference symlinks so real files land in DIST_DIR.
            for f in "${BAZEL_BIN}"/${pattern}; do
              [[ -e "${f}" ]] && cp -L "${f}" "${DIST_DIR}/${dir}/"
            done
          done <<< "${PATTERNS}"
        fi
        EOF
        export DOCKER_COMMAND="bash /source/_bazel_run.sh"
        exec docker compose \
          -f docker/docker-compose.yml \
          run \
          --rm \
          --volume /home/runner/.cache:/home/runner/.cache \
          -e DOCKER_COMMAND \
          -e BAZEL_CMD \
          -e GITHUB_TOKEN \
          -e USER_NAME \
          ${{ inputs.privileged && 'bazel-privileged' || 'bazel' }}
      env:
        ARTIFACT_PATTERNS: ${{ inputs.artifacts }}
        GITHUB_TOKEN: ${{ github.token }}
        UID: ${{ steps.runner-ids.outputs.uid }}
        GID: ${{ steps.runner-ids.outputs.gid }}
        USER_NAME: runner
        SOURCE_DIR: ${{ github.workspace }}
    - name: Bazel targets (${{ inputs.action }}/${{ inputs.bazel-mode }}) [host]
      if: runner.os != 'Linux'
      shell: bash
      run: >-
        exec bazel ${{ inputs.action }}
        ${{ inputs.bazel-args }}
        ${{ inputs.rbe
            && (steps.rbe.outputs.authorized == 'true'
                || github.event_name != 'pull_request')
            && format('--config={0}{1}',
                inputs.rbe-config || 'rbe',
                inputs.rbe-bes && ' --config=bes' || '') || ''
        }} ${{ inputs.targets }}
      working-directory: ${{ inputs.bazel-path }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Create source tarball
      id: source-tarball
      if: >-
        inputs.action == 'build'
        && inputs.bazel-path == 'bazel'
        && inputs.upload
        && inputs.create-source
      uses: envoyproxy/toolshed/actions/source@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        output-name: toolshed-bazel-v{version}.tar.gz
        source-path: bazel/
        transform: s,^bazel,toolshed-bazel-v{version},
        version-file: bazel/VERSION.txt
        exclude-patterns: |
          .git*
          bazel/bazel-*
    - name: Bazel source
      if: ${{ steps.source-tarball.outputs.tarball }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: bazel-source
        path: ${{ steps.source-tarball.outputs.tarball }}
        retention-days: 30
    - name: Bazel artifact paths
      id: artifact-paths
      if: >-
        inputs.action == 'build'
        && inputs.artifacts
        && inputs.upload
      uses: envoyproxy/toolshed/actions/jq@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        input: ${{ inputs.artifacts }}
        input-format: text
        options: -Rr
        filter: |
          select(length > 0)
          | "dist/\(.)"
    - name: Check artifact paths are non-empty
      if: inputs.upload && inputs.artifacts
      shell: bash
      run: |
        MISSING=()
        while IFS= read -r path; do
          [[ -z "$path" ]] && continue
          if ! compgen -G "$path" > /dev/null 2>&1; then
            MISSING+=("$path")
          fi
        done <<< "${{ steps.artifact-paths.outputs.value }}"
        if [[ ${#MISSING[@]} -gt 0 ]]; then
          echo "ERROR: the following artifact paths matched no files:"
          printf '  %s\n' "${MISSING[@]}"
          exit 1
        fi
    - name: Bazel artifacts
      if: ${{ inputs.upload && (steps.artifact-paths.outputs.value || steps.source-tarball.outputs.tarball) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.artifact-paths.outputs.value }}
        retention-days: 30
